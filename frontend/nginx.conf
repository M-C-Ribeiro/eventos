server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Chamadas da interface para a API: o navegador fala só com este servidor (sem CORS).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicação de página única: qualquer outra rota (ex.: /events/3) devolve o index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
